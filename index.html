<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語帳アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .progress-bar {
      width: 100%;
      background: #e0e0e0;
      border-radius: 10px;
      height: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background: #007aff;
      width: 0%;
      transition: width 0.3s ease;
    }
    .status {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
      font-weight: 600;
    }
    /* 3Dカードのアニメーション設定 */
    .card-container {
      width: 100%;
      height: 240px;
      perspective: 1000px;
      cursor: pointer;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #eef0f2;
    }
    .card-back {
      transform: rotateY(180deg);
      background: #f8fafd;
    }
    .word {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .meaning {
      font-size: 24px;
      font-weight: 700;
      color: #007aff;
      margin-bottom: 12px;
    }
    .hint {
      font-size: 13px;
      color: #8e8e93;
      line-height: 1.4;
    }
    .tap-info {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      color: #c7c7cc;
    }
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 24px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    .btn-review { background: #ff9500; color: white; }
    .btn-master { background: #34c759; color: white; }
    .btn-reset {
      margin-top: 16px;
      background: transparent;
      color: #8e8e93;
      font-size: 13px;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="progress-bar"><div class="progress" id="progress"></div></div>
  <div class="status" id="status">1 / 10</div>

  <div class="card-container" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="word" id="front-word">context</div>
        <div class="tap-info">タップして裏返す</div>
      </div>
      <div class="card-face card-back">
        <div class="meaning" id="back-meaning">文脈、背景、状況</div>
        <div class="hint" id="back-hint">historical context（歴史的背景）などの形でよく使われます。</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-review" onclick="markWord(false)">要復習 ✕</button>
    <button class="btn-master" onclick="markWord(true)">覚えた ◯</button>
  </div>

  <button class="btn-reset" onclick="resetProgress()">学習記録をリセット</button>
</div>

<script>
  const words = [
    { id: 1, word: "context", meaning: "文脈、背景、状況", hint: "historical context（歴史的背景）" },
    { id: 2, word: "democracy", meaning: "民主主義、民主政治", hint: "形容詞形は democratic（民主的な）" },
    { id: 3, word: "witness", meaning: "目撃者、証人 / 目撃する", hint: "a key witness（重要証人）" },
    { id: 4, word: "equivalent", meaning: "同等のもの / 同等の", hint: "be equivalent to ~（〜と同等である）" },
    { id: 5, word: "faculty", meaning: "学部、教授陣、（身体・精神の）能力", hint: "多義語！「大学の学部」と「人間が持つ能力」" },
    { id: 6, word: "load", meaning: "荷物、負担 / 荷を積む", hint: "a heavy load（重い荷物・大きな負担）" },
    { id: 7, word: "strain", meaning: "緊張、負担、疲労", hint: "under a lot of strain（大きなストレスを受けて）" },
    { id: 8, word: "vessel", meaning: "（大型の）船、血管、容器", hint: "blood vessel（血管）や大きな「船」" },
    { id: 9, word: "acquaintance", meaning: "知人、面識、知識", hint: "親しい友人（friend）ではなく「顔見知りの人」" },
    { id: 10, word: "parallel", meaning: "類似物、平行線 / 平行の", hint: "平行していることや共通・酷似しているもの" }
  ];

  let currentIndex = 0;
  let isFlipped = false;
  let mastered = JSON.parse(localStorage.getItem('mastered_words') || '[]');

  function updateCard() {
    isFlipped = false;
    document.getElementById('card').classList.remove('flipped');
    
    // まだ覚えていない単語を抽出
    const unmastered = words.filter(w => !mastered.includes(w.id));

    if (unmastered.length === 0) {
      document.getElementById('front-word').innerText = "全単語マスター！🎉";
      document.getElementById('back-meaning').innerText = "お疲れ様でした！";
      document.getElementById('back-hint').innerText = "リセットボタンで最初から復習できます。";
      document.getElementById('status').innerText = `${words.length} / ${words.length}`;
      document.getElementById('progress').style.width = "100%";
      return;
    }

    if (currentIndex >= unmastered.length) currentIndex = 0;

    const current = unmastered[currentIndex];
    document.getElementById('front-word').innerText = current.word;
    document.getElementById('back-meaning').innerText = current.meaning;
    document.getElementById('back-hint').innerText = current.hint;

    const completed = words.length - unmastered.length;
    document.getElementById('status').innerText = `${completed + 1} / ${words.length}`;
    document.getElementById('progress').style.width = `${(completed / words.length) * 100}%`;
  }

  function flipCard() {
    isFlipped = !isFlipped;
    document.getElementById('card').classList.toggle('flipped', isFlipped);
  }

  function markWord(isMastered) {
    const unmastered = words.filter(w => !mastered.includes(w.id));
    if (unmastered.length === 0) return;

    const current = unmastered[currentIndex];
    if (isMastered) {
      mastered.push(current.id);
      localStorage.setItem('mastered_words', JSON.stringify(mastered));
    } else {
      currentIndex = (currentIndex + 1) % unmastered.length;
    }
    updateCard();
  }

  function resetProgress() {
    if (confirm("学習記録をリセットして全単語を復習しますか？")) {
      mastered = [];
      localStorage.removeItem('mastered_words');
      currentIndex = 0;
      updateCard();
    }
  }

  updateCard();
</script>

</body>
</html>
